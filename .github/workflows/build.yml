name: Derleme ve Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Tip denetimi + birim testleri + web paketi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - name: Tip denetimi
        run: npm run typecheck
      - name: Birim testleri (SGP4 doğruluk testleri dahil)
        run: npm test
      - name: NASA dokuları
        run: npm run textures
      - name: Web paketi
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  e2e:
    name: Uçtan uca duman testi (Chromium + WebGL)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Duman testi
        run: npm run test:e2e
        env:
          E2E_REQUIRE_WEBGL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ekran-goruntuleri
          path: e2e/artifacts

  windows:
    name: Windows (Setup.exe + Portable)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - run: npm run textures
      - name: Tauri derlemesi
        run: npx tauri build
      - name: Çıktıları topla
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/SatelliteTracker-$v-Windows-Setup.exe"
          Copy-Item src-tauri/target/release/satellite-tracker.exe "out/SatelliteTracker-$v-Windows-Portable.exe"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm run textures
      - run: npm run build
      - name: Android projesini oluştur
        run: |
          npx cap add android
          node scripts/android-postsetup.mjs
          npx cap sync android
      - name: APK derle (imzalı — secret tanımlıysa)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cd android && ./gradlew --no-daemon assembleRelease
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/app.apk"
      - name: APK derle (hata ayıklama imzalı — secret yoksa)
        if: env.KEYSTORE_B64 == ''
        run: |
          cd android && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app.apk"
      - name: Çıktıyı adlandır
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out && cp "$RUNNER_TEMP/app.apk" "out/SatelliteTracker-$V-Android.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  builds-branch:
    name: Derlenmiş dosyaları 'builds' dalına koy
    if: always() && github.ref == 'refs/heads/main' && needs.windows.result == 'success' && needs.android.result == 'success'
    needs: [windows, android, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-ekran-goruntuleri
          path: out/e2e
      - name: builds dalına gönder
        run: |
          cd out
          echo "Derleme: ${GITHUB_SHA} · $(date -u +%FT%TZ)" > BUILD.txt
          git init -q -b builds
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Derleme ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
